<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1300" role="img" aria-label="第二章の背景：忘れ物の傘と雨上がり">
  <g fill="none" stroke="#6b5a33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.20">
    <!-- 雨上がりの日差し（右上） -->
    <g stroke-width="1.8">
      <path d="M 452 118 A 44 44 0 0 1 540 118"/>
      <line x1="496" y1="48" x2="496" y2="66"/><line x1="438" y1="66" x2="450" y2="80"/>
      <line x1="554" y1="66" x2="542" y2="80"/><line x1="420" y1="118" x2="438" y2="118"/>
      <line x1="554" y1="118" x2="572" y2="118"/>
    </g>
    <!-- 雨はこの絵には描かない（第一章と同じく、アニメーション層に一本化。v1.13.2）。
         日差し・傘・水たまりの線画はこの絵に残す -->
    <!-- 開いた傘（下部）。形は描き直し候補の A案「布の張り」（v1.13.3 で採用）：
         ドームを浅く広げ、パネルごとの膨らみで布の張りを出し、骨はハブから
         布裏を沿う湾曲に、裾のたわみは深めに、先端に石突き（小さな丸） -->
    <g transform="translate(300,1000)">
      <path d="M -168 120 Q -140 80 -112 60.1 Q -84 36.6 -56 33.1 Q -28 19 0 24.9 Q 28 19 56 33.1 Q 84 36.6 112 60.1 Q 140 80 168 120 Q 140 102 112 120 Q 84 102 56 120 Q 28 102 0 120 Q -28 102 -56 120 Q -84 102 -112 120 Q -140 102 -168 120 Z"/>
      <g stroke-width="1.6">
        <path d="M 0 44 Q -121 66 -168 120"/><path d="M 0 44 Q -80.6 70 -112 120"/>
        <path d="M 0 44 Q -40.3 76 -56 120"/><path d="M 0 44 Q 40.3 76 56 120"/>
        <path d="M 0 44 Q 80.6 70 112 120"/><path d="M 0 44 Q 121 66 168 120"/>
      </g>
      <path d="M 0 25 L 0 194 Q 0 220 -23 220 Q -47 220 -47 195"/>
      <path d="M 0 26 L 0 -4"/><circle cx="0" cy="-9" r="3.6"/>
    </g>
    <!-- 水たまり -->
    <ellipse cx="300" cy="1252" rx="176" ry="9" fill="#1b2a4a" stroke="none" fill-opacity="0.06"/>
    <ellipse cx="392" cy="1252" rx="54" ry="4" fill="#1b2a4a" stroke="none" fill-opacity="0.06"/>
  </g>
</svg>
