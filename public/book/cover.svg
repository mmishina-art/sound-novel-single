<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 540 800" width="540" height="800" role="img" aria-label="空の郵便が届くまで 表紙">
  <!-- viewBox は四六判の比率（127:188 ≒ 540:800）に合わせ、元の画を中央で切り取る。
       金枠は切り取り後の内側（左右18/28）に置く -->
  <!-- background navy -->
  <rect x="30" width="540" height="800" fill="#1b2a4a"/>
  <rect x="48" y="18" width="504" height="764" fill="none" stroke="#c9b87a" stroke-width="2"/>
  <rect x="58" y="28" width="484" height="744" fill="none" stroke="#c9b87a" stroke-width="0.8" opacity="0.6"/>

  <!-- rain lines -->
  <g stroke="#7aa0c8" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <line x1="90" y1="90" x2="78" y2="128"/><line x1="150" y1="70" x2="138" y2="108"/>
    <line x1="470" y1="80" x2="458" y2="118"/><line x1="520" y1="120" x2="508" y2="158"/>
    <line x1="110" y1="200" x2="98" y2="238"/><line x1="500" y1="230" x2="488" y2="268"/>
    <line x1="70" y1="300" x2="58" y2="338"/><line x1="530" y1="330" x2="518" y2="368"/>
    <line x1="420" y1="60" x2="408" y2="98"/><line x1="210" y1="55" x2="198" y2="93"/>
  </g>

  <!-- white bird (simple origami-like) -->
  <g transform="translate(300,235)">
    <path d="M -78 18 Q -30 -38 28 -22 Q 62 -52 88 -30 Q 48 -18 38 2 Q 70 8 78 28 Q 38 22 10 34 Q -28 52 -58 40 Q -30 28 -78 18 Z" fill="#ffffff"/>
    <circle cx="52" cy="-18" r="3.2" fill="#1b2a4a"/>
    <path d="M 62 -20 L 82 -14 L 62 -8 Z" fill="#e8c86a"/>
    <!-- envelope in beak / below -->
    <g transform="translate(38,42) rotate(-8)">
      <rect x="-26" y="-14" width="52" height="32" rx="2" fill="#f5efe0" stroke="#c9b87a" stroke-width="1"/>
      <path d="M -26 -14 L 0 6 L 26 -14" fill="none" stroke="#c9b87a" stroke-width="1.2"/>
    </g>
  </g>

  <!-- bookshop silhouette -->
  <g transform="translate(0,470)">
    <!-- roof -->
    <path d="M 120 60 L 300 10 L 480 60 L 460 78 L 140 78 Z" fill="#24365e"/>
    <rect x="150" y="78" width="300" height="150" fill="#223354"/>
    <!-- awning -->
    <path d="M 165 108 L 435 108 L 420 132 L 180 132 Z" fill="#8a2f35"/>
    <!-- windows / door -->
    <rect x="185" y="138" width="92" height="68" rx="3" fill="#f2d98a" opacity="0.92"/>
    <rect x="323" y="138" width="92" height="68" rx="3" fill="#f2d98a" opacity="0.78"/>
    <rect x="282" y="148" width="36" height="80" rx="2" fill="#3a2018"/>
    <circle cx="310" cy="190" r="2.5" fill="#e8c86a"/>
    <!-- sign -->
    <rect x="248" y="86" width="104" height="22" rx="3" fill="#f5efe0"/>
    <text x="300" y="101" text-anchor="middle" font-family="serif" font-size="12" fill="#1b2a4a" letter-spacing="2">柏木書店</text>
    <!-- ground puddle -->
    <ellipse cx="300" cy="238" rx="190" ry="10" fill="#2e4a7a" opacity="0.8"/>
    <ellipse cx="230" cy="238" rx="60" ry="5" fill="#7aa0c8" opacity="0.45"/>
  </g>

  <!-- title / author / colophon are HTML overlays (see index.html):
       vertical title next to the spine, like a right-bound book cover.
       Author stays baked at the bottom. -->
  <text x="300" y="742" text-anchor="middle" font-family="'Hiragino Mincho ProN','Hiragino Mincho Pro','Yu Mincho','YuMincho','Noto Serif JP',serif" font-size="20" fill="#e8e2d0" letter-spacing="6">水瀬 葵</text>
</svg>
