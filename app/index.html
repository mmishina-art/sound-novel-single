<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>空の郵便が届くまで — 水瀬 葵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ COVER VIEW ============ -->
<section id="coverView" class="view view-cover">
  <button id="coverTap" class="cover-tap" aria-label="表紙をタップして第1章から読む">
    <img src="cover.svg" alt="空の郵便が届くまで — 水瀬 葵" class="cover-img">
  </button>
  <p class="cover-hint">表紙をタップすると 第1章の朗読が始まります</p>
  <div class="cover-actions">
    <button id="resumeBtn" class="btn btn-primary" hidden>しおりから再開</button>
    <button id="tocFromCoverBtn" class="btn btn-ghost">目次</button>
  </div>
  <p id="bookmarkInfo" class="bookmark-info" hidden></p>
</section>

<!-- ============ GATE / CHAPTER TITLE VIEW ============ -->
<section id="gateView" class="view view-gate" hidden>
  <div class="gate-inner">
    <p id="gateNum" class="gate-num"></p>
    <h2 id="gateTitle" class="gate-title"></h2>
    <p id="gateNarrator" class="gate-narrator"></p>
    <p class="gate-hint">タップで本文へ</p>
  </div>
</section>

<!-- ============ READER VIEW ============ -->
<section id="readerView" class="view view-reader" hidden>
  <header class="reader-header">
    <button id="toCoverBtn" class="btn btn-small">表紙へ</button>
    <span id="readerChapterLabel" class="reader-chapter-label"></span>
    <button id="tocBtn" class="btn btn-small">章一覧</button>
    <label class="toggle-label"><input type="checkbox" id="rubyToggle" checked> フリガナ</label>
  </header>

  <div id="gateBlock" class="gate-block">
    <p id="blockNum" class="gate-num"></p>
    <h2 id="blockTitle" class="gate-title"></h2>
    <p id="blockNarrator" class="gate-narrator"></p>
  </div>

  <article id="textBody" class="text-body" aria-label="本文"></article>

  <div id="endView" class="end-view" hidden>
    <p class="end-mark">おわり</p>
    <p class="end-sub">『空の郵便が届くまで』をお聴きいただき、ありがとうございました。</p>
    <button id="endToCoverBtn" class="btn btn-primary">表紙に戻る</button>
  </div>

  <footer class="player">
    <p id="audioError" class="audio-error" hidden></p>
    <div class="progress-row">
      <span id="currentTime" class="time-label">0:00</span>
      <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" aria-label="再生位置">
      <span id="durationTime" class="time-label">0:00</span>
    </div>
    <div class="controls-row">
      <button id="prevChapterBtn" class="btn" aria-label="前章">⏮ 前章</button>
      <button id="playPauseBtn" class="btn btn-primary btn-play" aria-label="再生・停止">▶ 再生</button>
      <button id="nextChapterBtn" class="btn" aria-label="次章">次章 ⏭</button>
      <button id="speedBtn" class="btn" aria-label="再生速度">1.0×</button>
    </div>
  </footer>
</section>

<!-- ============ TOC MODAL ============ -->
<div id="tocModal" class="modal" hidden role="dialog" aria-modal="true" aria-label="章一覧">
  <div class="modal-backdrop" id="tocBackdrop"></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h3>章一覧</h3>
      <button id="tocCloseBtn" class="btn btn-small">閉じる</button>
    </div>
    <ul id="tocList" class="toc-list"></ul>
  </div>
</div>

<audio id="audioEl" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
